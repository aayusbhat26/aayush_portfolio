name: Sync LeetCode record

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-leetcode
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch LeetCode stats
        run: node scripts/sync-leetcode.mjs

      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- src/data/leetcode.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the new snapshot
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/leetcode.json
          git commit -m "chore: sync LeetCode record"
          git push

      - name: Trigger Render deploy
        if: steps.changes.outputs.changed == 'true' && env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
